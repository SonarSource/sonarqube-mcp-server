name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish (e.g. 1.18.1.2664)'
        required: true
      dry_run:
        description: 'Build only, do not push to registry'
        type: boolean
        default: true
      sqs_tag:
        description: 'Optional SonarQube Server-aligned tag (e.g. 2026.5.0). Leave empty to skip.'
        required: false
        default: ''
      update_latest:
        description: 'Move the latest tag: auto (only if this is the highest published version), always, or never'
        type: choice
        options:
          - auto
          - always
          - never
        default: auto

# Serialize real publishes so each run sees the tags pushed by the previous one
# (SQS tag existence, highest version for latest); dry runs stay parallel
concurrency:
  group: docker-publish-${{ inputs.dry_run && github.run_id || 'release' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build parameters
    runs-on: warp-custom-ubuntu-24-04
    permissions: {}
    outputs:
      version: ${{ steps.params.outputs.version }}
      tags: ${{ steps.params.outputs.tags }}
      push: ${{ steps.params.outputs.push }}
      ref: ${{ steps.params.outputs.ref }}
      temp_image: ${{ steps.params.outputs.temp_image }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute build parameters
        id: params
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_UPDATE_LATEST: ${{ inputs.update_latest }}
          INPUT_SQS_TAG: ${{ inputs.sqs_tag }}
        run: |
          VERSION="${INPUT_TAG}"
          echo "ref=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"

          if [ -n "${INPUT_SQS_TAG}" ]; then
            if ! [[ "${INPUT_SQS_TAG}" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid sqs_tag '${INPUT_SQS_TAG}', expected <SQS major>.<SQS minor>.<patch> (e.g. 2026.5.0)"
              exit 1
            fi
            # SQS-aligned tags are immutable: never overwrite an existing one.
            # Only an explicit "not found" means the tag is free; any other error (rate limit, network) fails
            if OUT=$(docker buildx imagetools inspect "sonarsource/sonarqube-mcp:${INPUT_SQS_TAG}" 2>&1); then
              echo "::error::Tag sonarsource/sonarqube-mcp:${INPUT_SQS_TAG} already exists"
              exit 1
            elif ! grep -qi 'not found' <<< "${OUT}"; then
              echo "::error::Could not check whether sonarsource/sonarqube-mcp:${INPUT_SQS_TAG} exists: ${OUT}"
              exit 1
            fi
          fi

          # Only move latest forward: a maintenance patch of an older line must not become latest
          case "${INPUT_UPDATE_LATEST:-auto}" in
            always) UPDATE_LATEST=true ;;
            never) UPDATE_LATEST=false ;;
            # Dry runs never push latest, so don't depend on the Docker Hub tags API
            auto)
              if [ "${INPUT_DRY_RUN}" = "true" ]; then
                echo "Dry run: skipping the published-version lookup"
                UPDATE_LATEST=false
              else
                PUBLISHED=""
                URL="https://hub.docker.com/v2/repositories/sonarsource/sonarqube-mcp/tags?page_size=100"
                while [ -n "${URL}" ] && [ "${URL}" != "null" ]; do
                  if ! PAGE=$(curl -fsS --retry 3 "${URL}"); then
                    echo "::error::Could not list published tags to decide whether to move latest; set update_latest explicitly"
                    exit 1
                  fi
                  PUBLISHED="${PUBLISHED}$(jq -r '.results[].name' <<< "${PAGE}")"$'\n'
                  URL=$(jq -r '.next' <<< "${PAGE}")
                done
                HIGHEST=$(printf '%s\n%s\n' "${PUBLISHED}" "${VERSION}" | grep -E '^[0-9]+(\.[0-9]+){3}$' | sort -V | tail -n 1)
                echo "Highest version (published or current): ${HIGHEST}"
                if [ "${HIGHEST}" = "${VERSION}" ]; then UPDATE_LATEST=true; else UPDATE_LATEST=false; fi
              fi
              ;;
            *)
              echo "::error::Invalid update_latest '${INPUT_UPDATE_LATEST}'"
              exit 1
              ;;
          esac
          echo "Move latest to ${VERSION}: ${UPDATE_LATEST}"

          if [ "${INPUT_DRY_RUN}" = "false" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            TAGS="sonarsource/sonarqube-mcp:${VERSION}"
            if [ "${UPDATE_LATEST}" = "true" ]; then
              TAGS="${TAGS}"$'\n'"sonarsource/sonarqube-mcp:latest"
            fi
            if [ -n "${INPUT_SQS_TAG}" ]; then
              TAGS="${TAGS}"$'\n'"sonarsource/sonarqube-mcp:${INPUT_SQS_TAG}"
            fi
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            TAGS="sonarsource/sonarqube-mcp:${VERSION}"
          fi
          echo "Tags to publish:"$'\n'"${TAGS}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "temp_image=ttl.sh/sonarqube-mcp-server-${{ github.run_id }}:1h" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build multi-platform image
    needs: prepare
    runs-on: warp-custom-ubuntu-24-04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: multibuilder
          driver: docker-container

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Build and push to temporary registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            MCP_SERVER_VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ needs.prepare.outputs.temp_image }}

  test:
    name: Smoke test (${{ matrix.platform }})
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: warp-custom-ubuntu-24-04
          - platform: linux/arm64
            runner: github-ubuntu-24.04-arm-s
    runs-on: ${{ matrix.runner }}
    permissions: {}
    steps:
      - name: Smoke test
        run: |
          CONTAINER_ID=$(docker run -d -i \
            --platform ${{ matrix.platform }} \
            -e SONARQUBE_IS_CLOUD=true \
            -e SONARQUBE_URL=https://sonarcloud.io \
            -e SONARQUBE_TOKEN=smoke-test \
            -e SONARQUBE_ORG=smoke-test-org \
            -e TELEMETRY_DISABLED=true \
            ${{ needs.prepare.outputs.temp_image }})

          echo "Container ID: ${CONTAINER_ID}"

          SUCCESS=false
          for i in $(seq 1 30); do
            sleep 2
            if docker logs "${CONTAINER_ID}" 2>&1 | grep -q 'SonarQube MCP Server Started'; then
              SUCCESS=true
              break
            fi
            if [ "$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null)" != "running" ]; then
              echo "Container stopped unexpectedly"
              break
            fi
          done

          echo "--- Container logs ---"
          docker logs "${CONTAINER_ID}" 2>&1
          echo "--- End of logs ---"

          docker stop "${CONTAINER_ID}" > /dev/null 2>&1 || true

          if [ "${SUCCESS}" = "false" ]; then
            echo "Smoke test FAILED: server did not log startup message within 60 seconds"
            exit 1
          fi
          echo "Smoke test PASSED"

  publish:
    name: Publish to Docker Hub
    needs: [prepare, test]
    if: needs.prepare.outputs.push == 'true'
    runs-on: warp-custom-ubuntu-24-04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - id: secrets
        name: Retrieve secrets from Vault
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce # 3.7.0
        with:
          secrets: |
            development/kv/data/docker/sonardockerrw username | docker_username;
            development/kv/data/docker/sonardockerrw access_token_rwd | docker_password;

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ fromJSON(steps.secrets.outputs.vault).docker_username }}
          password: ${{ fromJSON(steps.secrets.outputs.vault).docker_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: multibuilder
          driver: docker-container

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Check SQS tag is still free
        if: inputs.sqs_tag != ''
        env:
          INPUT_SQS_TAG: ${{ inputs.sqs_tag }}
        run: |
          # Re-check right before pushing, in case the tag was published since the prepare job
          if OUT=$(docker buildx imagetools inspect "sonarsource/sonarqube-mcp:${INPUT_SQS_TAG}" 2>&1); then
            echo "::error::Tag sonarsource/sonarqube-mcp:${INPUT_SQS_TAG} already exists"
            exit 1
          elif ! grep -qi 'not found' <<< "${OUT}"; then
            echo "::error::Could not check whether sonarsource/sonarqube-mcp:${INPUT_SQS_TAG} exists: ${OUT}"
            exit 1
          fi

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            MCP_SERVER_VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ needs.prepare.outputs.tags }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [prepare, publish]
    if: needs.prepare.outputs.push == 'true'
    runs-on: warp-custom-ubuntu-24-04
    # The Docker image is already published at this point: a registry failure must not fail the run.
    # It is reported as an error annotation and in the job summary instead.
    continue-on-error: true
    permissions:
      # GitHub OIDC grants the io.github.SonarSource/* namespace in the registry
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz

      # At the release tag, server.json still has the previous version: the bump only lands in the
      # "Prepare next development iteration" PR. Publish the semantic version of the released tag.
      - name: Set server.json version
        id: semver
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SEMVER=$(echo "${VERSION}" | cut -d. -f1-3)
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          python3 - "${SEMVER}" <<'PY'
          import json, sys
          with open("server.json") as f:
              server = json.load(f)
          server["version"] = sys.argv[1]
          with open("server.json", "w") as f:
              json.dump(server, f, indent=2)
              f.write("\n")
          PY
          echo "Publishing server.json version ${SEMVER}"

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Report success
        env:
          SEMVER: ${{ steps.semver.outputs.semver }}
        run: |
          echo "### MCP Registry: published ${SEMVER} ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "::error title=MCP Registry publication failed::The Docker image ${VERSION} was published, but publishing to registry.modelcontextprotocol.io failed. See the 'Publish to MCP Registry' job logs."
          {
            echo "### MCP Registry: publication failed ❌"
            echo
            echo "The Docker image \`${VERSION}\` was published to Docker Hub. Only the MCP Registry step failed."
            echo
            echo "To retry without rebuilding the image, re-run only the **Publish to MCP Registry** job from this run."
            echo "Otherwise, a SonarSource org Owner can publish manually: from a checkout of tag \`${VERSION}\`, set \`version\` in \`server.json\` to the semantic version, then run \`mcp-publisher login github\` and \`mcp-publisher publish\`."
          } >> "$GITHUB_STEP_SUMMARY"
