name: Build

on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

# Workflow-level concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# Required permissions for Vault OIDC and repo operations
permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: sonar-s
    name: Build
    outputs:
      PROJECT_VERSION: ${{ steps.build-step.outputs.project-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.6.1

      - id: build-step
        uses: SonarSource/ci-github-actions/build-gradle@b4eede988476ebb13a242fbc3ae4e8e374d78ad0 # 2.5.1
        with:
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          sonar-platform: sqc-eu
          gradle-args: :cyclonedxBom jacocoTestReport
          use-develocity: true

  integration:
    needs: [build]
    runs-on: github-ubuntu-latest-m
    name: IT - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: STDIO
            test_class: StdioTransportITest
          - name: HTTP
            test_class: HttpTransportITest
          - name: ProxiedServer
            test_class: ProxiedServerITest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.6.1

      - name: Vault (SonarCloud IT token)
        id: vault_it_token
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce # 3.7.0
        with:
          secrets: |
            development/team/sonarlint/kv/data/sonarcloud-it token | SONARCLOUD_IT_TOKEN;

      - uses: SonarSource/ci-github-actions/config-gradle@b4eede988476ebb13a242fbc3ae4e8e374d78ad0 # 2.5.1
        with:
          artifactory-reader-role: private-reader

      - name: Download plugin from Artifactory
        env:
          PROJECT_VERSION: ${{ needs.build.outputs.PROJECT_VERSION }}
        run: |
          set -euo pipefail
          echo "Using project version: ${PROJECT_VERSION}"
          DOWNLOAD_URL="${ARTIFACTORY_URL}/sonarsource-public-qa/org/sonarsource/sonarqube/mcp/server/sonarqube-mcp-server/${PROJECT_VERSION}/sonarqube-mcp-server-${PROJECT_VERSION}.jar"
          
          curl -fsSL -u "${ARTIFACTORY_ACCESS_USERNAME}:${ARTIFACTORY_ACCESS_TOKEN}" \
            -o sonarqube-mcp-server.jar \
            "${DOWNLOAD_URL}"
          
          mkdir -p ${GITHUB_WORKSPACE}/downloaded-plugin
          mv sonarqube-mcp-server.jar ${GITHUB_WORKSPACE}/downloaded-plugin/

      - name: Run Integration Tests
        env:
          SONARCLOUD_IT_TOKEN: ${{ steps.vault_it_token.outputs.vault && fromJSON(steps.vault_it_token.outputs.vault).SONARCLOUD_IT_TOKEN || '' }}
          DOWNLOADED_JAR_PATH: ${{ github.workspace }}/downloaded-plugin/sonarqube-mcp-server.jar
        run: |
          ./gradlew :its:cleanIntegrationTest :its:integrationTest --tests "org.sonarsource.sonarqube.mcp.its.${{ matrix.test_class }}" --info

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports-${{ matrix.name }}
          path: |
            its/build/test-results/integrationTest/
            its/build/reports/tests/integrationTest/
          if-no-files-found: error

  promote:
    needs: [build, integration]
    runs-on: github-ubuntu-latest-s  # Public repository runner
    name: Promote
    steps:
      - uses: SonarSource/ci-github-actions/promote@b4eede988476ebb13a242fbc3ae4e8e374d78ad0 # 2.5.1
        with:
          promote-pull-request: true
